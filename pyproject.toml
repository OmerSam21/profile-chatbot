[project]
name = "profile-chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.32.0",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
